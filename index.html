
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SapaDesa - Sampah Pintar Desa</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#10b981">
    <link rel="apple-touch-icon" href="/vite.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Plus Jakarta Sans"', 'sans-serif'],
            },
            colors: {
              primary: {
                DEFAULT: '#10b981', // emerald-500
                focus: '#059669',   // emerald-600
                content: '#ffffff',
                light: '#d1fae5',  // emerald-100
                gradientStart: '#34d399', // emerald-400
                gradientEnd: '#0d9488', // teal-600
              },
              secondary: '#6366f1', // indigo-500
              accent: '#f59e0b', // amber-500
              neutral: '#1e293b', // slate-800
              'base-100': '#f8fafc', // slate-50
              info: '#3b82f6', // blue-500
              success: '#22c55e', // green-500
              warning: '#eab308', // yellow-500
              error: '#ef4444', // red-500
              slate: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334152',
                800: '#1e293b',
                900: '#0f172a',
              }
            },
            boxShadow: {
              'soft': '0 10px 40px -10px rgba(0, 0, 0, 0.08)',
              'glow': '0 0 20px rgba(16, 185, 129, 0.4)',
              'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
            }
          },
        },
      }
    </script>
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        color: #334152;
        background-color: #f8fafc;
        background-image: 
          radial-gradient(at 0% 0%, hsla(160,60%,96%,1) 0, transparent 50%), 
          radial-gradient(at 50% 100%, hsla(190,60%,96%,1) 0, transparent 50%),
          radial-gradient(at 100% 0%, hsla(210,60%,97%,1) 0, transparent 50%);
        background-attachment: fixed;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Plus Jakarta Sans', 'sans-serif';
      }
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1; 
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8; 
      }
      .smooth-transition {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }
      @keyframes slideInUp {
        from { transform: translateY(20px); opacity: 0; }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-in-up {
        animation: slideInUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .glass {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
      }
      .floating-dock {
         background: #0f172a; 
         color: white;
      }
    </style>
  </head>
  <body class="text-slate-800 bg-slate-50 antialiased">
    <div id="root">
      <div id="initial-loader" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, sans-serif;">
        <div style="background: rgba(255, 255, 255, 0.9); padding: 32px; border-radius: 24px; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.07); border: 1px solid #e2e8f0; text-align: center; max-width: 320px; width: 90%;">
          <div style="display: inline-block; width: 44px; height: 44px; border: 4px solid #10b981; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px;"></div>
          <h3 style="margin: 0 0 6px 0; font-size: 16px; font-weight: 800; color: #0f172a;">SapaDesa</h3>
          <p style="margin: 0; font-size: 12px; color: #64748b; font-weight: 600;">Menyiapkan aplikasi...</p>
        </div>
      </div>
    </div>
    <style>
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>

    <script>
      // Active SW and Cache cleanup for development/preview iframe
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var reg of regs) reg.unregister();
        }).catch(function(){});
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var key of keys) caches.delete(key);
        }).catch(function(){});
      }

      // Visual Error Trap so screen never stays blank on unexpected error
      window.addEventListener('error', function(e) {
        console.error('Captured window error:', e);
        var loader = document.getElementById('initial-loader');
        if (loader) {
          loader.innerHTML = '<div style="background:#fff; padding:24px; border-radius:20px; border:1px solid #fecdd3; max-width:380px; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,0.05);"><div style="font-size:24px; color:#ef4444; margin-bottom:8px;">⚠️</div><h4 style="margin:0 0 8px; color:#991b1b; font-weight:800; font-size:14px;">Gagal Memuat Script</h4><p style="margin:0 0 14px; font-size:11px; color:#64748b; font-family:monospace; word-break:break-all;">' + (e.message || 'Error executing script') + '</p><button onclick="location.reload()" style="background:#10b981; color:#fff; border:none; padding:8px 18px; border-radius:12px; font-weight:700; font-size:12px; cursor:pointer;">Muat Ulang</button></div>';
        }
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
